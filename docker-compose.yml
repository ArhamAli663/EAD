version: '3.8'

services:
  messmanagement:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mess-management-system
    ports:
      - "80:8080" # HTTP traffic: external 80 -> internal 8080
    volumes:
      - mess-data:/app/data # Persist SQLite database
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/Account/Login" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mess-data:
    driver: local
